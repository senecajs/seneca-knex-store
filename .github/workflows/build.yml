name: build

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: senecatest_0102
          POSTGRES_DB: senecatest_knex
          POSTGRES_USER: senecatest
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U senecatest -d senecatest_knex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SENECA_TEST_PG_HOST: 127.0.0.1
      SENECA_TEST_PG_PORT: 55433
      SENECA_TEST_PG_USER: senecatest
      SENECA_TEST_PG_PASSWORD: senecatest_0102
      SENECA_TEST_PG_DATABASE: senecatest_knex

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      # Service containers start before checkout, so the schema is loaded here.
      - name: Load test schema
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55433 -U senecatest -d senecatest_knex -f test/config/docker/dbschema.sql
        env:
          PGPASSWORD: senecatest_0102
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
